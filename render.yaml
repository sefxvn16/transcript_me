services:
  - type: web
    name: transcript-downloader-trial
    runtime: docker
    plan: free
    region: singapore
    rootDir: downloader-trial
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
  - type: web
    name: transcript-tts
    runtime: docker
    plan: free
    region: singapore
    rootDir: tts-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: southeastasia
