<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; line-height: 1.5; }
    input, select, button, textarea { font: inherit; box-sizing: border-box; }
    input[type=url], select, textarea { width: 100%; padding: 8px; }
    .row { margin: 12px 0; }
    button { padding: 8px 14px; margin: 4px 4px 4px 0; }
    #status { color: #555; white-space: pre-wrap; }
    #output { min-height: 320px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Transcript</h1>

  <div class="row">
    <label for="url">Link (YouTube, Facebook)</label>
    <input id="url" type="url" placeholder="https://...">
  </div>
  <div class="row">
    <label for="file">Hoặc chọn file video/audio</label><br>
    <input id="file" type="file" accept="audio/*,video/*">
  </div>
  <div class="row">
    <label for="lang">Ngôn ngữ</label>
    <select id="lang">
      <option value="">Tự nhận diện</option>
      <option value="vi">Tiếng Việt</option>
      <option value="en">Tiếng Anh</option>
    </select>
  </div>
  <div class="row">
    <button id="run">Lấy transcript</button>
  </div>

  <p id="status"></p>

  <div id="result" class="hidden">
    <div class="row">
      <button id="copy">Copy</button>
      <button id="dl-txt">Tải .txt</button>
      <button id="dl-md">Tải .md</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>

  <script src="app.js"></script>
</body>
</html>
